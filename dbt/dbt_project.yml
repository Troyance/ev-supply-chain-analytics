name: ev_supply_chain
version: "1.0.0"
profile: ev_supply_chain
config-version: 2

vars:
  raw_schema: ev_bronze   # where the spark notebooks land source data
  shortage_start: "2021-06-01"
  shortage_peak: "2022-04-01"
  shortage_end: "2022-12-31"

flags:
  require_generic_test_arguments_property: true

models:
  ev_supply_chain:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: ev_staging
      +materialized: view
    core:
      +schema: ev_silver
      +materialized: table
      intermediate:
        +materialized: view
    marts:
      +schema: ev_gold
      +materialized: table

seeds:
  ev_supply_chain:
    +schema: ev_silver

data_tests:
  +severity: error
