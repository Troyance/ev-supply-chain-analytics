name: ev_supply_chain
version: "1.0.0"
profile: ev_supply_chain
config-version: 2

vars:
  raw_schema: ev_bronze   # where the spark notebooks land source data
  shortage_start: "2021-06-01"
  shortage_peak: "2022-04-01"
  shortage_end: "2022-12-31"

flags:
  require_generic_test_arguments_property: true

models:
  ev_supply_chain:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: ev_staging
      +materialized: view
      +databricks_tags: {layer: staging, domain: supply_chain}
    core:
      +schema: ev_silver
      +materialized: table
      +databricks_tags: {layer: silver, domain: supply_chain, certified: "true"}
      intermediate:
        +materialized: view
        +databricks_tags: {layer: silver, domain: supply_chain, model_type: intermediate}
      dims:
        +databricks_tags: {layer: silver, domain: supply_chain, certified: "true", model_type: dimension}
      facts:
        +databricks_tags: {layer: silver, domain: supply_chain, certified: "true", model_type: fact}
      product:
        +databricks_tags: {layer: silver, domain: product_development, certified: "true"}
    marts:
      +schema: ev_gold
      +materialized: table
      +databricks_tags: {layer: gold, domain: supply_chain, certified: "true", model_type: mart}
      metrics:
        +databricks_tags: {layer: gold, domain: supply_chain, certified: "true", model_type: metric_view}

seeds:
  ev_supply_chain:
    +schema: ev_silver

data_tests:
  +severity: error
