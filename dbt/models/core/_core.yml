- name: tier_uses_only_prior_months
  description: A month's tier is judged on the 12 months before it, and suppliers need 20 deliveries of history to be rated.
  model: int_supplier_monthly_performance
  given:
  - input: ref('stg_erp__po_deliveries')
    format: sql
    rows: select 1 as supplier_id, date'2024-01-15' as received_date, date'2024-01-15' as promised_date from range(30) union all select 1, date'2024-02-15',
      case when id < 6 then date'2024-02-10' else date'2024-02-15' end from range(30) union all select 1, date'2024-03-15', date'2024-03-15' from
      range(10) union all select 2, date'2024-01-15', date'2024-01-15' from range(10) union all select 2, date'2024-02-15', date'2024-02-15' from
      range(1)
  expect:
    rows:
    - supplier_id: 1
      month_start: '2024-01-01'
      tier: Unrated
    - supplier_id: 1
      month_start: '2024-02-01'
      tier: A
    - supplier_id: 1
      month_start: '2024-03-01'
      tier: B
    - supplier_id: 2
      month_start: '2024-01-01'
      tier: Unrated
    - supplier_id: 2
      month_start: '2024-02-01'
      tier: Unrated
