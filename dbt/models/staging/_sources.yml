version: 2

# everything the spark notebooks land in ev_bronze. in a real company these would be fivetran-synced
# erp / mes / wms / service tables, plus outputs from the forecasting and simulation jobs.
sources:
  - name: tpch
    description: TPC-H sample data, only used for the supplier master (names, countries, regions).
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: tpch_supplier
      - name: tpch_nation
      - name: tpch_region

  - name: erp
    description: Parts master, BOM, suppliers, sourcing, purchasing and MRP planning parameters.
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: erp_sites
      - name: erp_vehicle_models
      - name: erp_parts
      - name: erp_bom
      - name: erp_suppliers
        description: Supplier profiles. Also holds the generator's hidden truth (p_late, is_slipping) which staging drops.
      - name: erp_sourcing
      - name: erp_po_deliveries
      - name: erp_part_planning_parameters

  - name: mes
    description: Manufacturing execution - what got built.
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: mes_vehicle_builds

  - name: plm
    description: Product lifecycle management - programs, prototype builds, item master, multi-level BOM, issues and engineering changes.
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: plm_programs
      - name: plm_prototype_builds
      - name: plm_items
      - name: plm_bom_lines
      - name: plm_issues
      - name: plm_engineering_changes
      - name: plm_eco_affected_items

  - name: service
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: service_demand

  - name: wms
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: wms_inventory_snapshot

  - name: ml
    description: Forecasting job output. Append-only.
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: ml_forecast_runs
        config:
          loaded_at_field: created_at
          freshness:
            warn_after: {count: 8, period: day}
      - name: ml_forecasts

  - name: sim
    description: Simulation job output. Only exists after the simulation notebooks run, so everything built on it is tagged simulation.
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: sim_policy_daily
      - name: sim_inventory_projection
