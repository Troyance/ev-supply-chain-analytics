    data_type: string
    description: Recall campaign.
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: campaign_id
    data_type: string
    description: NHTSA campaign number, e.g. 22V037000.
  - name: make
    data_type: string
    description: Make.
    constraints:
    - type: not_null
    data_tests:
    - not_null
