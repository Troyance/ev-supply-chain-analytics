# used by github actions. everything comes from repo secrets, nothing sensitive lives here.
ev_supply_chain:
  target: ci
  outputs:
    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: workspace
      schema: ev_silver
      threads: 8
